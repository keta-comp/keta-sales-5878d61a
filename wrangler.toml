name = "ketaone"
main = ".output/server/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"

# Sirli qiymatlar `wrangler secret put` bilan qo'yiladi:
#   NEON_DATABASE_URL, NEON_AUTH_ISSUER, TELEGRAM_BOT_TOKEN, LOVABLE_CRON_SECRET,
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, OPENROUTER_API_KEY (yoki GEMINI_API_KEY)
# Oddiy (maxfiy bo'lmagan) qiymatlar esa shu yerda:
[vars]
PUBLIC_APP_URL = "https://ketaone.uz"
S3_REGION = "auto"

# Cloudflare cron trigger'i faqat `/` ga GET yuboradi, shuning uchun kunlik
# hisobot va eslatmalarni .github/workflows/scheduler.yml chaqiradi.
